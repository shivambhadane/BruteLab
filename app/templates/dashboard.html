<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BruteLab Level 2 — Session Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header-brand">
            <div>
                <h1 class="brand-title">BruteLab Dashboard</h1>
                <p class="brand-subtitle">Active Session: {{ username }}</p>
            </div>
            <div>
                <a href="/logout" class="btn-secondary">Logout</a>
            </div>
        </header>

        <!-- Session Status Panel -->
        <div class="panel" style="margin-bottom: 1.25rem;">
            <div class="panel-title" style="margin-bottom: 0.85rem;">Verification Status</div>
            
            <div class="info-row">
                <span class="info-label">Authenticated Account</span>
                <span class="info-value">{{ username }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Password Hash Verification</span>
                <span class="info-value" style="color: #3fb950;">Argon2id Pass</span>
            </div>
            <div class="info-row" style="border-bottom: none;">
                <span class="info-label">Rate Limiting Status</span>
                <span class="info-value" style="color: #3fb950;">Compliant</span>
            </div>
        </div>

        <footer>
            BruteLab Level 2 Laboratory Environment
        </footer>
    </div>
</body>
</html>
