<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthForge Level 2 — Session Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header-brand">
            <div>
                <h1 class="brand-title">AuthForge Dashboard</h1>
                <p class="brand-subtitle">Active Session: {{ username }}</p>
            </div>
            <div>
                <a href="/logout" class="btn-secondary">Logout</a>
            </div>
        </header>

        <!-- Session Status Panel -->
        <div class="panel" style="margin-bottom: 1.25rem;">
            <div class="panel-title" style="margin-bottom: 0.85rem;">Verification Status</div>
            
            <div class="info-row">
                <span class="info-label">Authenticated Account</span>
                <span class="info-value">{{ username }}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Password Hash Verification</span>
                <span class="info-value" style="color: #3fb950;">Argon2id Pass</span>
            </div>
            <div class="info-row" style="border-bottom: none;">
                <span class="info-label">Rate Limiting Status</span>
                <span class="info-value" style="color: #3fb950;">Compliant (5/min)</span>
            </div>
        </div>

        <!-- Terminal Audit Stream -->
        <div class="terminal-panel">
            <div class="terminal-header">
                <span class="terminal-title">Audit Stream — logs/auth.log</span>
                <button onclick="fetchLogs()" class="btn-secondary">Refresh Logs</button>
            </div>
            <div class="terminal-body" id="log-terminal">
                <div class="text-muted">Loading audit events...</div>
            </div>
        </div>

        <footer>
            AuthForge Level 2 Laboratory Environment
        </footer>
    </div>

    <script>
        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs');
                if (res.ok) {
                    const data = await res.json();
                    const container = document.getElementById('log-terminal');
                    if (!data.logs || data.logs.length === 0) {
                        container.innerHTML = '<div class="text-muted">No audit events logged.</div>';
                        return;
                    }
                    container.innerHTML = data.logs.map(line => {
                        let className = 'log-line';
                        if (line.includes('result=SUCCESS')) className += ' log-success';
                        if (line.includes('result=FAILED') || line.includes('RATE_LIMITED') || line.includes('LOCKED')) className += ' log-failed';
                        return `<div class="${className}">${line}</div>`;
                    }).join('');
                    container.scrollTop = container.scrollHeight;
                }
            } catch (err) { console.error(err); }
        }
        
        fetchLogs();
        setInterval(fetchLogs, 4000);
    </script>
</body>
</html>
